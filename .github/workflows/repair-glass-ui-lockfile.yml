name: repair-glass-ui-lockfile

on:
  push:
    branches:
      - chore/consolidate-glass-ui-dependencies

permissions:
  contents: write

concurrency:
  group: repair-glass-ui-lockfile
  cancel-in-progress: false

jobs:
  regenerate-and-verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: glass-ui
    steps:
      - name: Checkout dependency consolidation branch
        uses: actions/checkout@v7
        with:
          ref: chore/consolidate-glass-ui-dependencies
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: glass-ui/package-lock.json

      - name: Regenerate npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify clean install
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test -- --watchAll=false

      - name: Application build
        run: npm run build

      - name: Library build
        run: npm run build:lib

      - name: Storybook build
        run: npm run build-storybook

      - name: Commit generated lockfile
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add glass-ui/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile is already synchronized."
          else
            git commit -m "chore(glass-ui): regenerate npm lockfile"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
